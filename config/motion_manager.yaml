controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

cartesian_motion_controller:
  ros__parameters:
    end_effector_link: "tool0"
    robot_base_link: "base_link"
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    # See the cartesian_compliance_controller
    command_interfaces:
      - position
        #- velocity
    state_interfaces:
      - position
      - velocity

    solver:
      error_scale: 1.0
      iterations: 100
      publish_state_feedback: True

    pd_gains:
      trans_x: { p: 1.0, d: 0.05 }
      trans_y: { p: 1.0, d: 0.05 }
      trans_z: { p: 1.0, d: 0.05 }
      rot_x: { p: 0.5, d: 0.05 }
      rot_y: { p: 0.5, d: 0.05 }
      rot_z: { p: 0.5, d: 0.05 }
