controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    initial_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

initial_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      shoulder_pan_joint: {trajectory: 0.2, goal: 0.1}
      shoulder_lift_joint: {trajectory: 0.2, goal: 0.1}
      elbow_joint: {trajectory: 0.2, goal: 0.1}
      wrist_1_joint: {trajectory: 0.2, goal: 0.1}
      wrist_2_joint: {trajectory: 0.2, goal: 0.1}
      wrist_3_joint: {trajectory: 0.2, goal: 0.1}

    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

    # 初始轨迹点
    default_constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0

    # 初始位置作为默认轨迹点
    gains:
      shoulder_pan_joint: {p: 100.0, i: 1.0, d: 10.0}
      shoulder_lift_joint: {p: 100.0, i: 1.0, d: 10.0}
      elbow_joint: {p: 100.0, i: 1.0, d: 10.0}
      wrist_1_joint: {p: 100.0, i: 1.0, d: 10.0}
      wrist_2_joint: {p: 100.0, i: 1.0, d: 10.0}
      wrist_3_joint: {p: 100.0, i: 1.0, d: 10.0}

    # 添加初始位置配置
    initial_positions:
      shoulder_pan_joint: 0.0
      shoulder_lift_joint: 0.0  # -pi/2
      elbow_joint: 0.0
      wrist_1_joint: 0.0       # -pi/2
      wrist_2_joint: 0.0
      wrist_3_joint: 0.0
      
cartesian_motion_controller:
  ros__parameters:
    end_effector_link: "tool0"
    robot_base_link: "base"
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    # See the cartesian_compliance_controller
    command_interfaces:
      - position
        #- velocity
    state_interfaces:
      - position
      - velocity

    solver:
      error_scale: 1.0
      iterations: 100
      publish_state_feedback: True

    pd_gains:
      trans_x: { p: 1.0, d: 0.05 }
      trans_y: { p: 1.0, d: 0.05 }
      trans_z: { p: 1.0, d: 0.05 }
      rot_x: { p: 0.5, d: 0.05 }
      rot_y: { p: 0.5, d: 0.05 }
      rot_z: { p: 0.5, d: 0.05 }
